name: rafeeq
description: Rafeeq pilgrim app (with staff mode).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State and navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # API and storage (offline cache and queue are JSON in shared_preferences)
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0

  # Device features
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  mobile_scanner: ^6.0.2
  url_launcher: ^6.3.1
  flutter_tts: ^4.2.0
  flutter_compass: ^0.8.1
  vibration: ^2.0.1
  qr_flutter: ^4.1.0

  # Bluetooth nearby finder: scan with flutter_blue_plus, advertise with flutter_ble_peripheral
  flutter_blue_plus: ^1.34.5
  flutter_ble_peripheral: ^1.2.6

  # Maps: OpenStreetMap tiles, cached; walking routes come from the offline map pack
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
