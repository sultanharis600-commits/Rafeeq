services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rafeeq
      POSTGRES_PASSWORD: rafeeq
      POSTGRES_DB: rafeeq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rafeeq"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["full"]
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://rafeeq:rafeeq@postgres:5432/rafeeq
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
